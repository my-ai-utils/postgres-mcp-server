[package]
name = "postgres-mcp-ui"
version = "0.1.0"
edition = "2024"

[features]
default = ["web"]
web = ["dioxus/web"]

[dependencies]
dioxus = { version = "0.7", features = ["router"] }
dioxus-utils = { tag = "0.7.0", git = "https://github.com/MyJetTools/dioxus-utils.git", features = [
    "web",
] }

# HTTP client. Tag 0.7.0 is REQUIRED: it is the first tag with a
# `cfg(target_arch = "wasm32")` fetch backend, so 0.6.1 does not compile to wasm.
# Do not downgrade to match the server crate's pin.
flurl = { tag = "0.7.0", git = "https://github.com/MyJetTools/fl-url.git" }

serde_json = { version = "*" }
serde = { version = "*", features = ["derive"] }

web-sys = { version = "*", features = ["Storage", "Window", "Document", "Element"] }
js-sys = { version = "*" }

[build-dependencies]
ci-utils = { git = "https://github.com/MyJetTools/ci-utils.git", tag = "0.1.3" }

[profile.release]
strip = "debuginfo"
