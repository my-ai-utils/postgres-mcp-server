[package]
name = "postgres-mcp-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }

my-http-server = { tag = "0.9.0", git = "https://github.com/MyJetTools/my-http-server.git", features = [
    "macros",
    "controllers",
    "static-files",
] }

my-http-utils = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-http-utils.git", features = [
    "server",
] }

rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git" }

my-settings-reader = { tag = "0.5.0", git = "https://github.com/MyJetTools/my-settings-reader.git" }

my-logger = { tag = "1.3.0", git = "https://github.com/MyJetTools/my-logger.git" }


my-postgres = { tag = "0.6.0", git = "https://github.com/MyJetTools/my-postgres.git", features = [
    "with-tls",
    "macros",
    "with-ssh",
] }

my-json5 = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-json5.git" }


serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

parking_lot = { version = "0.12" }

# Metrics history. Pure Rust on purpose — no Rust->C marshalling, which rules out
# every SQLite binding (rusqlite/libsqlite3-sys) and therefore my-sqlite, which
# wraps async-sqlite. redb is a single-file ACID B-tree; the access pattern here
# (append by timestamp, range-scan a window, range-delete everything past the
# retention horizon) is exactly what it is good at, so no SQL is needed.
redb = { version = "4.1" }

async-trait = { version = "*" }

uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4" }
tokio-postgres = { version = "0.7", features = [
    "with-uuid-1",
    "with-serde_json-1",
    "with-chrono-0_4",
] }

my-ai-agent = { tag = "0.1.0", git = "https://github.com/my-ai-utils/my-ai-agent.git", features = [
    "agent",
] }

flurl = { tag = "0.7.0", git = "https://github.com/MyJetTools/fl-url.git", features = [
    "with-ssh",
] }

mcp-server-middleware = { tag = "0.9.0", git = "https://github.com/my-ai-utils/mcp-server-middleware.git" }


[build-dependencies]
ci-utils = { git = "https://github.com/MyJetTools/ci-utils.git", tag = "0.1.3" }
